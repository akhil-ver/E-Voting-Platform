version: '3.8'

services:
  besu-dev:
    image: hyperledger/besu:latest
    container_name: sovereign-democracy-besu-node
    restart: unless-stopped
    ports:
      - "8545:8545"
      - "8546:8546"
    command:
      - --network=dev
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,WEB3
      - --rpc-http-cors-origins=*
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --host-allowlist=*
      - --data-path=/opt/besu/data
    volumes:
      - besu_dev_data:/opt/besu/data

volumes:
  besu_dev_data:
