spring.application.name=sovereign-democracy

# Active Profile: 'local' (default) or 'online' (Aiven Cloud MySQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Configuration
server.port=8080

# JWT Token Configuration
jwt.secret=${JWT_SECRET:sovereign_democracy_secure_secret_jwt_hmac_sha256_key_2026_voting}
jwt.expiration-ms=86400000

# Logging
logging.level.com.sovereign.democracy=INFO
logging.level.org.springframework.security=WARN

# Blockchain Configuration (Hyperledger Besu / Ethereum JSON-RPC)
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x9A676e781A523b5d0C0e43731313A708CB607508}
blockchain.signer-private-key=${BLOCKCHAIN_SIGNER_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
blockchain.enabled=${BLOCKCHAIN_ENABLED:true}
blockchain.required-confirmations=${BLOCKCHAIN_CONFIRMATIONS:1}

# Google Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.enabled=${GEMINI_ENABLED:true}
gemini.timeout-seconds=15
gemini.rate-limit-per-minute=30

# App & Recovery Configuration
app.base-url=${APP_BASE_URL:http://localhost:3000}

# Supplementary Firebase Firestore Configuration
firebase.project-id=${FIREBASE_PROJECT_ID:evotingsystem-4c3a1}
firebase.api-key=${FIREBASE_API_KEY:AIzaSyCJGa3s2WAM6q3Gndw1-KPEQc4ZhoP_vZg}
firebase.database-url=${FIREBASE_DATABASE_URL:https://evotingsystem-4c3a1-default-rtdb.firebaseio.com}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.firestore.collection.audit=${FIREBASE_FIRESTORE_AUDIT_COLLECTION:security_audit_logs}
firebase.firestore.collection.member=${FIREBASE_FIRESTORE_MEMBER_COLLECTION:member_metadata}


