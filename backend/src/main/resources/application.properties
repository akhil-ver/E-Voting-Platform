spring.application.name=sovereign-democracy

# Active Profile: 'local' (default) or 'online' (Aiven Cloud MySQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Configuration
server.port=8080

# JWT Token Configuration
jwt.secret=${JWT_SECRET:sovereign_democracy_secure_secret_jwt_hmac_sha256_key_2026_voting}
jwt.expiration-ms=86400000

# Logging
logging.level.com.sovereign.democracy=INFO
logging.level.org.springframework.security=WARN

# Blockchain Configuration (Hyperledger Besu / Ethereum JSON-RPC)
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x9A676e781A523b5d0C0e43731313A708CB607508}
blockchain.signer-private-key=${BLOCKCHAIN_SIGNER_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
blockchain.enabled=${BLOCKCHAIN_ENABLED:true}
blockchain.required-confirmations=${BLOCKCHAIN_CONFIRMATIONS:1}

